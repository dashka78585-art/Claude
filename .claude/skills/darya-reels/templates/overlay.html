<!doctype html>
<!-- Шаблон слоёв: заголовок + субтитр-плашка.
     FONTS_DIR — платные шрифты Дарьи (Stolzl, Peach Cream), SKILL_FONTS — бесплатные OFL из скилла (Oswald, Sacramento).
     Субтитры: <b>…</b> — рукопись Peach Cream (чувства), <i>…</i> — жёлтый (вывод врача).
     Заголовок: .main — огромный Oswald (строки через <br>), .acc — тонкая рукопись Sacramento с обводкой, .tail — мелкая строка Stolzl Bold. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:PC;src:url(FONTS_DIR/Peach_Cream.otf)}
@font-face{font-family:ST;src:url(FONTS_DIR/stolzl_regular.otf)}
@font-face{font-family:STB;src:url(FONTS_DIR/stolzl_bold.otf)}
@font-face{font-family:OS;src:url(SKILL_FONTS/Oswald-Bold.ttf)}
@font-face{font-family:SA;src:url(SKILL_FONTS/Sacramento.ttf)}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;color:#fff}
/* заголовок (утверждён 13.11.2026) */
#head{position:absolute;left:0;right:0;top:150px;text-align:center;display:none}
#head .main{white-space:nowrap;font:228px/0.86 OS;text-transform:uppercase;padding:0 40px;text-shadow:0 3px 24px rgba(0,0,0,.22)}
#head .acc{position:relative;display:inline-block;transform:rotate(-7deg);margin-top:-250px;left:-40px;
  font:200px/1 SA;color:var(--acc);paint-order:stroke fill;-webkit-text-stroke:14px #fff}
#head .tail{font:96px/1 STB;text-align:right;padding-right:70px;margin-top:40px;text-shadow:0 3px 24px rgba(0,0,0,.22)}
#head.bordeaux{--acc:#6E1F2F}
#head.green{--acc:#3E4A2C}
/* субтитры */
#sub{position:absolute;top:1400px;left:0;right:0;text-align:center;white-space:nowrap}
#sub span{display:inline-block;background:rgba(110,106,78,.85);padding:14px 34px 18px;border-radius:30px;font:66px/1.15 ST}
#sub b{font:96px/0.6 PC;font-weight:normal;padding:0 4px;position:relative;top:6px}
#sub i{font-style:normal;color:#F5DE9A}
</style></head><body>
<div id="head"><div class="main"></div><div class="acc"></div><div class="tail"></div></div>
<div id="sub"></div></body></html>
