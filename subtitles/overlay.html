<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MR;src:url(fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:MR;src:url(fonts/manrope-cyrillic-800-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:UB;src:url(fonts/unbounded-latin-700-normal.woff2)}
@font-face{font-family:UB;src:url(fonts/unbounded-cyrillic-700-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:CV;src:url(fonts/caveat-latin-700-normal.woff2)}
@font-face{font-family:CV;src:url(fonts/caveat-cyrillic-700-normal.woff2);unicode-range:U+0400-04FF}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
:root{--ink:#2E2624;--rose:#C85A78;--glow:0 0 2px #fff,0 0 8px rgba(255,255,255,.85),0 0 22px rgba(255,255,255,.5)}
#head{position:absolute;top:175px;left:60px;right:60px;text-align:center;display:none}
#head .t{font:700 74px/1.1 UB;color:var(--ink);text-transform:uppercase;text-shadow:var(--glow)}
#head .h{font:700 150px/0.85 CV;color:var(--rose);transform:rotate(-4deg);margin-top:6px;text-shadow:var(--glow)}
#sub{text-wrap:balance;position:absolute;top:1330px;left:90px;right:90px;text-align:center;font:800 70px/1.2 MR;color:var(--ink);text-shadow:var(--glow)}
#sub b{font:700 104px/1 CV;padding:0 .14em;color:var(--rose);font-weight:700}
</style></head><body>
<div id="head"><div class="t">Мне муж не даст</div><div class="h">бросить ГВ</div></div>
<div id="sub"></div></body></html>
